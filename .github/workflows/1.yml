name: Build KemonoDownloader

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read version
        id: version
        shell: bash
        # 使用 Python 3.12 内置的 tomllib，无需额外安装 toml 包
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['briefcase']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSI
          - os: windows-latest
            type: msi
            artifact: windows-msi
            arch: x86_64
          # Windows Portable
          - os: windows-latest
            type: portable
            artifact: windows-portable
            arch: x86_64
          # macOS Universal2
          - os: macos-latest
            type: dmg
            artifact: mac-universal
            arch: universal2
          # Linux DEB —— 舊 Ubuntu 24.04 (noble, Python 3.12 → libpython3.12)
          # 這裡刻意寫死 ubuntu-24.04 而非 ubuntu-latest：
          # ubuntu-latest 將於 2026-11 改指向 26.04，屆時會默默地換掉這個 leg 的目標。
          - os: ubuntu-24.04
            type: deb
            artifact: linux-deb-2404
            arch: x86_64
          # Linux RPM —— 舊 Ubuntu 24.04 (el-noble)
          # GitHub Actions 沒有 fedora-latest，用 ubuntu 配合 rpm 工具即可
          - os: ubuntu-24.04
            type: rpm
            artifact: linux-rpm-2404
            arch: x86_64
          # Linux DEB —— 新 Ubuntu 26.04 (resolute, Python 3.14 → libpython3.14)
          - os: ubuntu-26.04
            type: deb
            artifact: linux-deb-2604
            arch: x86_64
          # Linux RPM —— 新 Ubuntu 26.04
          - os: ubuntu-26.04
            type: rpm
            artifact: linux-rpm-2604
            arch: x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # ========================
      # Linux system deps
      # ========================
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            build-essential pkg-config \
            libgtk-3-dev libcairo2-dev libglib2.0-dev \
            gir1.2-gtk-3.0 \
            libpulse-mainloop-glib0 libpulse0 libxcb-xinerama0 mesa-utils \
            rpm fakeroot

      # ========================
      # Python dependencies
      # ========================
      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python3 -m pip install --break-system-packages --upgrade pip
            if [[ "${{ matrix.type }}" == "portable" ]]; then
              python3 -m pip install --break-system-packages pyinstaller
            else
              python3 -m pip install --break-system-packages briefcase PyQt6
            fi
          else
            python -m pip install --upgrade pip
            if [[ "${{ matrix.type }}" == "portable" ]]; then
              pip install pyinstaller
            else
              pip install briefcase PyQt6
            fi
          fi

      # ========================
      # Portable build
      # ========================
      - name: Build Windows portable
        if: matrix.type == 'portable'
        shell: bash
        run: |
          pyinstaller --onefile \
            --noconsole \
            --name KemonoDownloader \
            src/kemonodownloader/app.py

          mkdir -p release
          mv dist/KemonoDownloader.exe \
            release/W-KemonoDownloader-${{ needs.prepare.outputs.version }}-Portable.exe

      # ========================
      # Briefcase create/build
      # ========================
      - name: Briefcase create/build
        if: matrix.type != 'portable'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python3 -m briefcase create
            python3 -m briefcase build
          else
            briefcase create
            briefcase build
          fi

      # ========================
      # Package
      # ========================
      - name: Package
        if: matrix.type != 'portable'
        shell: bash
        run: |
          # Linux 用 python3 -m briefcase；Windows/macOS 用裸 briefcase。
          # 兩者不能互換：macOS runner 上 python3 是 Homebrew 的 Python，其中沒有 briefcase。
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            BC=(python3 -m briefcase)
          else
            BC=(briefcase)
          fi

          # --adhoc-sign: 不做簽章，避免卡在簽章身分的互動提問
          #   （macOS 是 code signing identity，Linux 是 GPG identity）
          # --no-input: 任何殘餘提問都不等待輸入（CI 沒有 TTY，等待會變成 Aborted by user / exit 214）
          case "${{ matrix.type }}" in
            msi)  "${BC[@]}" package --adhoc-sign --no-input ;;
            dmg)  "${BC[@]}" package -p dmg --adhoc-sign --no-input ;;
            deb)  "${BC[@]}" package -p deb --adhoc-sign --no-input ;;
            rpm)  "${BC[@]}" package -p rpm --adhoc-sign --no-input || \
                    echo "::warning::briefcase rpm packaging 回報失敗，改由後續步驟直接收集 dist/ 下的 rpm" ;;
          esac

      # briefcase 用 distribution_filename() 組出的 RPM 檔名會帶 distro tag
      # (例如 kemonodownloader-5.13.0-1.elnoble.x86_64.rpm)，但 rpmbuild 的 spec
      # 是 `Release: 1%{?dist}`，在 Ubuntu 上 %dist 未定義 → 實際產物是
      # kemonodownloader-5.13.0-1.x86_64.rpm，兩者不符會讓 briefcase 的 move() 丟
      # FileNotFoundError。這裡把實際建出的 rpm 從 rpmbuild 目錄補進 dist/。
      - name: Normalize RPM output
        if: matrix.type == 'rpm'
        shell: bash
        run: |
          if compgen -G "dist/*.rpm" > /dev/null; then
            echo "briefcase 已產出 rpm："
            ls -l dist/*.rpm
            exit 0
          fi

          echo "dist/ 沒有 rpm，改從 rpmbuild 目錄回收…"
          FOUND=$(find build -type f -name '*.rpm' -path '*/RPMS/*' | head -n 1)
          if [[ -z "$FOUND" ]]; then
            echo "::error::找不到任何 rpm 產物"
            find build -type d -name RPMS -exec find {} -type f \; 2>/dev/null || true
            exit 1
          fi

          mkdir -p dist
          cp "$FOUND" "dist/$(basename "$FOUND")"
          ls -l dist/*.rpm

      # ========================
      # Collect artifacts
      # ========================
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.type }}" == "msi" ]]; then
            cp dist/*.msi release/
          elif [[ "${{ matrix.type }}" == "dmg" ]]; then
            cp dist/*.dmg release/
            mv release/*.dmg release/M-KemonoDownloader-${{ needs.prepare.outputs.version }}-universal.dmg
          elif [[ "${{ matrix.type }}" == "deb" ]]; then
            # briefcase 的 deb 檔名已含目標代號 (ubuntu-noble / ubuntu-resolute)，
            # 兩個 Ubuntu 版本的產物不會互蓋。
            cp dist/*.deb release/
          elif [[ "${{ matrix.type }}" == "rpm" ]]; then
            # 補上建置環境代號，讓 24.04/26.04 的 rpm 一眼可辨
            for f in dist/*.rpm; do
              cp "$f" "release/${{ matrix.artifact }}-$(basename "$f")"
            done
          fi

          # 每個平台都必須真的交出檔案，否則讓該 matrix leg 明確失敗
          if ! compgen -G "release/*" > /dev/null; then
            echo "::error::此平台未產出任何檔案（type=${{ matrix.type }}）"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  release:
    needs: [prepare, build]
    # 即使有單一平台建置失敗，也要把已成功平台的產物發佈出去，
    # 而不是整個 release 一起被拖垮（原本 needs 失敗時 release 直接跳過）。
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Fail if no artifacts
        run: |
          # download-artifact 會依 artifact 名稱建立子目錄，
          # 所以用 find 遞迴偵測，不能用 compgen 的 ** 萬用字元。
          if ! find artifacts -type f -print -quit 2>/dev/null | grep -q .; then
            echo "::error::沒有任何可發佈的產物"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: KemonoDownloader v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
